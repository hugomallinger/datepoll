  <path d="M30 92 L10 120 L46 106 Z" fill="#25D366" stroke="#25D366" stroke-width="6" stroke-linejoin="round"/>

  <!-- Calendar page -->
  <rect x="34" y="34" width="64" height="56" rx="9" fill="#ffffff"/>
  <path d="M34 43 a9 9 0 0 1 9 -9 h46 a9 9 0 0 1 9 9 v9 h-64 z" fill="#0b7a5c"/>
  <!-- Binder rings -->
  <rect x="47" y="26" width="8" height="16" rx="4" fill="#ffffff" stroke="#0b7a5c" stroke-width="3"/>
  <rect x="77" y="26" width="8" height="16" rx="4" fill="#ffffff" stroke="#0b7a5c" stroke-width="3"/>
  <!-- Check mark: the chosen date -->
