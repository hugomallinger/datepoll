<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="scene.css">
<style>
  body { width: 1400px; height: 560px; padding: 0 110px; gap: 0; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 36px; }
  .brand img { width: 168px; height: 168px; }
  .brand h1 { margin: 0 0 12px; font-size: 72px; letter-spacing: -1px; }
  .brand p { margin: 0; font-size: 28px; line-height: 1.3; color: #b9c6c0; }
  .poll { align-self: center; width: 400px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45); }
</style>

<div class="brand">
  <img src="../../icons/icon.svg" alt="">
  <div>
    <h1>Datepoll</h1>
    <p>Date polls in one click.<br>Pick days, send the poll.</p>
  </div>
</div>

<div class="poll">
  <h3>Which weekend works?</h3>
  <div class="sub">Select one or more</div>
  <div class="opt"><div class="row"><span class="box on"></span>Fri 6 – Sun 8 Nov<span class="n">2</span></div><div class="bar"><i style="width:40%"></i></div></div>
  <div class="opt"><div class="row"><span class="box on"></span>Fri 13 – Sun 15 Nov<span class="n">5</span></div><div class="bar"><i style="width:100%"></i></div></div>
  <div class="opt"><div class="row"><span class="box"></span>Fri 20 – Sun 22 Nov<span class="n">1</span></div><div class="bar"><i style="width:20%"></i></div></div>
  <div class="opt"><div class="row"><span class="box"></span>Fri 27 – Sun 29 Nov<span class="n">3</span></div><div class="bar"><i style="width:60%"></i></div></div>
  <div class="foot">View votes</div>
</div>
